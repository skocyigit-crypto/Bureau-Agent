name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    name: FastAPI Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api-py/pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Analyse statique. Le stock d'avertissements existant est fige par
      # --max-warnings: il ne bloque personne, mais il ne peut plus grandir.
      # Toute regle hors de ce stock est une erreur. Voir eslint.config.mjs
      # pour le detail du reglage et pourquoi il est calibre ainsi.
      - name: Lint
        run: pnpm run lint:ratchet

      # Les vulnerabilites des dependances de PRODUCTION. Le script existait
      # depuis longtemps mais aucune etape ne l'appelait, donc les exceptions
      # de pnpm.auditConfig.ignoreGhsas n'etaient jamais reconfrontees a la
      # realite. --audit-level high: seules les severites haute et critique
      # font echouer, pour que la barriere reste actionnable.
      - name: Audit des dependances de production
        run: pnpm run security:audit

      - name: Check API route inventory
        run: pnpm --filter @workspace/api-spec routes:check

      # Isolation multi-locataire. Il n'y a pas de Row-Level Security cote
      # Postgres: rien n'empeche structurellement une requete d'oublier son
      # filtre d'organisation, et cet oubli ne produit aucune erreur — la page
      # s'affiche, avec les lignes d'un autre client. Cette barriere est ce qui
      # tient lieu de garde-fou en attendant.
      - name: Check tenant isolation
        run: pnpm --filter @workspace/api-server tenant:check

      # Accessibilite des formulaires. Un champ dont le seul libelle est un
      # placeholder n'a pas de nom accessible: le texte disparait des que
      # l'utilisateur tape. C'est une obligation (European Accessibility Act)
      # et un defaut invisible a l'ecran. Le cliquet interdit d'en ajouter.
      - name: Check form accessibility
        run: pnpm --filter @workspace/buro-ajani a11y:check

      # Meme regle cote mobile, avec l'attribut de React Native. Mesure avant
      # correction: 75 champs, zero accessibilityLabel — l'application etait
      # inutilisable au lecteur d'ecran sans qu'aucun ecran n'ait l'air casse.
      - name: Check mobile accessibility
        run: pnpm --filter @workspace/mobile a11y:check

      - name: Build
        # Mobile falls back to the production domain when no preview domain
        # is provided; mockup-sandbox uses local PORT/BASE_PATH defaults.
        # Keep both in CI so their cross-platform production builds cannot regress.
        run: pnpm -r --if-present run build

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Most api-server tests import lib/db, which hard-fails at import time
      # if DATABASE_URL is unset - a real ephemeral Postgres is needed even
      # for tests that only touch a handful of tables.
      postgres:
        # Debian-based, not -alpine: the schema-push pipeline's
        # ensure-search-extensions step needs pg_trgm/unaccent, which are
        # part of the default postgresql-contrib install on the Debian
        # image but may not be present on the Alpine one.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_de_bureau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_de_bureau_test
      # lib/integrations-gemini-ai/src/image/client.ts and
      # lib/integrations-openai-ai-server/src/{image,audio}/client.ts throw
      # at import time (same pattern as lib/db) if these are unset - several
      # test files transitively import them and were failing at collection
      # time, before any assertion ran. Placeholder values only need to
      # satisfy the guard; nothing in these test files makes a real call
      # through these clients.
      AI_INTEGRATIONS_GEMINI_BASE_URL: http://localhost:9/unused
      AI_INTEGRATIONS_GEMINI_API_KEY: ci-placeholder
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://localhost:9/unused
      AI_INTEGRATIONS_OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push DB schema to test database
        working-directory: lib/db
        # Meme chaine que le script "push-force". schema-guard tourne APRES la
        # poussee, comme dans deploy/cloudbuild.yaml et pour la meme raison: la
        # base vient d'etre synchronisee, il ne doit donc rien trouver. S'il
        # signale une suppression, c'est que SA lecture du schema a derive — et
        # un garde-fou qui a derive ne protege plus la production, ou il est le
        # seul rempart devant un "push --force" lance a la main.
        #
        # Les trois derniers pas, eux, sont indispensables et manquaient:
        # ensure-user-quota installe le trigger Postgres qui applique la
        # limite de sieges payants — c'est un controle de facturation, et il
        # ne vivait dans aucune base de test; ensure-user-sessions cree la
        # table de sessions; verify-schema-sync verifie ensuite que la
        # poussee a bien produit les tables/colonnes dont l'app depend et
        # n'a pas detruit user_sessions. Sans eux, le schema teste par la CI
        # n'etait pas celui qui tourne en production.
        run: >-
          node ./scripts/ensure-search-extensions.mjs &&
          node ./scripts/ensure-unique-constraint-names.mjs &&
          node ./scripts/ensure-automation-logs-rule-id.mjs &&
          node ./scripts/ensure-fk-orphans.mjs &&
          pnpm exec drizzle-kit push --force --config ./drizzle.config.ts &&
          node ./scripts/schema-guard.mjs &&
          node ./scripts/ensure-audit-append-only.mjs &&
          node ./scripts/ensure-user-quota.mjs &&
          node ./scripts/ensure-user-sessions.mjs &&
          node ./scripts/verify-schema-sync.mjs

      # Run per-package rather than the combined "pnpm run test": these five
      # steps are individually confirmed passing, but the combined
      # "pnpm -r --if-present run test" (even with --workspace-concurrency=1)
      # failed at this same point for reasons that weren't identifiable
      # without authenticated log access - running them as separate steps
      # sidesteps whatever pnpm -r does differently.
      - name: Test - api-server
        id: test-api-server
        continue-on-error: true
        run: pnpm --filter @workspace/api-server run test

      # L'application client principale: 73 000 lignes, la seule que les clients
      # ouvrent tous les jours. Sa suite existait deja et passait, mais aucune
      # etape ne l'appelait — le budget d'accessibilite, l'inventaire des routes,
      # le service worker et les icones PWA pouvaient donc casser sans un rouge.
      - name: Test - buro-ajani
        id: test-buro-ajani
        continue-on-error: true
        run: pnpm --filter @workspace/buro-ajani run test

      - name: Test - mobile
        id: test-mobile
        continue-on-error: true
        run: pnpm --filter @workspace/mobile run test

      - name: Test - tanitim
        id: test-tanitim
        continue-on-error: true
        run: pnpm --filter @workspace/tanitim run test

      - name: Test - demo-handoff
        id: test-demo-handoff
        continue-on-error: true
        run: pnpm --filter @workspace/demo-handoff run test

      - name: Test suites - gate
        if: always()
        run: |
          echo "api-server: ${{ steps.test-api-server.outcome }}"
          echo "buro-ajani: ${{ steps.test-buro-ajani.outcome }}"
          echo "mobile: ${{ steps.test-mobile.outcome }}"
          echo "tanitim: ${{ steps.test-tanitim.outcome }}"
          echo "demo-handoff: ${{ steps.test-demo-handoff.outcome }}"
          if [ "${{ steps.test-api-server.outcome }}" = "failure" ] || [ "${{ steps.test-buro-ajani.outcome }}" = "failure" ] || [ "${{ steps.test-mobile.outcome }}" = "failure" ] || [ "${{ steps.test-tanitim.outcome }}" = "failure" ] || [ "${{ steps.test-demo-handoff.outcome }}" = "failure" ]; then
            echo "One or more test suites failed."
            exit 1
          fi

  docker-build-api:
    name: Docker image build (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Un seul navigateur: ces tests verifient que la page s'affiche, pas la
      # compatibilite entre moteurs. Trois navigateurs tripleraient l'attente
      # pour la meme reponse.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Le typage, les 869 tests unitaires et l'inventaire des routes peuvent
      # tous etre verts pendant que le site affiche une page blanche. C'est le
      # seul controle de ce depot qui ouvre reellement une page.
      - name: Browser smoke tests
        run: pnpm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ecrans-connectes:
    name: Ecrans connectes (navigateur)
    runs-on: ubuntu-latest
    # Les tests « Browser smoke » ci-dessus s'arretent a la porte: formulaire de
    # connexion, route inconnue, CSP, manifeste. Tout ce que le client PAIE est
    # derriere cette porte, et rien ne l'ouvrait automatiquement.
    #
    # Le 18/09/2026, ouvrir ces ecrans a la main a trouve un defaut qu'aucune
    # suite ne voyait: l'ecran « Utilisateurs » affichait un plafond invente de
    # 5 comptes parce qu'il avalait un 404. Un ecran peut mentir en silence
    # pendant que 2 500 tests unitaires restent verts.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_de_bureau_ecrans
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_de_bureau_ecrans
      SESSION_SECRET: ci-ecrans-session-secret-aaaaaaaaaaaaaaaa
      # Aucune de ces cles n'est appelee: les ecrans sont ouverts, pas exerces.
      # Elles satisfont les gardes d'import (meme raison que dans le job test).
      AI_INTEGRATIONS_GEMINI_BASE_URL: http://localhost:9/unused
      AI_INTEGRATIONS_GEMINI_API_KEY: ci-placeholder
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://localhost:9/unused
      AI_INTEGRATIONS_OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Push DB schema
        working-directory: lib/db
        run: |
          pnpm exec drizzle-kit push --force --config ./drizzle.config.ts
          node ./scripts/ensure-user-quota.mjs
          node ./scripts/ensure-user-sessions.mjs

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Start API
        run: |
          PORT=8080 NODE_ENV=development \
          ALLOWED_ORIGINS=http://127.0.0.1:5173,http://127.0.0.1:8080 \
          PUBLIC_URL=http://127.0.0.1:5173 \
          node artifacts/api-server/dist/index.mjs > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/api/healthz > /dev/null; then echo "API prete"; exit 0; fi
            sleep 2
          done
          echo "::error::L'API n'a pas demarre"; tail -50 /tmp/api.log; exit 1

      # Le compte est cree par l'INSCRIPTION publique, pas par un INSERT: un
      # semis qui ecrit en base peut produire un etat qu'aucun client n'aurait.
      - name: Semer le compte de verification
        run: BASE=http://127.0.0.1:8080 node scripts/semer-verif.mjs

      - name: Start web
        working-directory: artifacts/buro-ajani
        run: |
          BASE_PATH=/ npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null; then echo "Web pret"; exit 0; fi
            sleep 2
          done
          echo "::error::Vite n'a pas demarre"; tail -50 /tmp/vite.log; exit 1

      # Un lot, pas les 63 ecrans: au-dela, le limiteur applicatif (1000
      # requetes / 15 min) rendrait le resultat « non juge », ce qui ne prouve
      # rien et ferait echouer la porte pour une mauvaise raison.
      - name: Ouvrir les ecrans
        run: APP=http://127.0.0.1:5173 DEBUT=0 FIN=24 node scripts/verif-ecrans.mjs

      - name: Journaux en cas d'echec
        if: failure()
        run: |
          echo "--- API ---"; tail -100 /tmp/api.log || true
          echo "--- WEB ---"; tail -50 /tmp/vite.log || true
