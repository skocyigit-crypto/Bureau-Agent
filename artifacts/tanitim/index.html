<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Pas de maximum-scale/user-scalable : bloquer le zoom pince casse
         l'accessibilite mobile (WCAG 2.1 - 1.4.4 Redimensionnement du texte). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Ajant Bureau — Standardiste IA, agenda et CRM pour PME</title>
    <meta name="description" content="Ajant Bureau centralise vos appels, contacts, tâches et messages avec une IA française. Standardiste virtuelle 24/7, transcription, CRM, agenda et facturation pour PME et professions libérales." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG et non SVG : iOS ignore le SVG pour l'icone d'ecran d'accueil et
         pose a la place une capture de la page. Rendu depuis favicon.svg, qui
         reste la source. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://agentdebureau.fr/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Ajant Bureau" />
    <meta property="og:url" content="https://agentdebureau.fr/" />
    <meta property="og:title" content="Ajant Bureau — Standardiste IA, agenda et CRM pour PME" />
    <meta property="og:description" content="Centralisez appels, contacts, tâches et messages avec une IA française. Standardiste virtuelle 24/7." />
    <!-- URL absolue : Facebook/LinkedIn/WhatsApp ne resolvent pas toujours un
         chemin relatif lors du scraping de la carte de partage. -->
    <meta property="og:image" content="https://agentdebureau.fr/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ajant Bureau — tableau de bord de la plateforme" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ajant Bureau — Standardiste IA pour PME" />
    <meta name="twitter:description" content="Centralisez appels, contacts, tâches et messages avec une IA française." />
    <meta name="twitter:image" content="https://agentdebureau.fr/opengraph.jpg" />

    <!-- Inter est empaquetee avec l'application (@fontsource/inter), pas
         chargee depuis Google. L'ancien montage demandait la feuille a
         fonts.googleapis.com et les fichiers a fonts.gstatic.com: chaque
         visiteur transmettait son adresse IP a Google AVANT tout
         consentement, alors que le bandeau et la politique de confidentialite
         annoncent l'absence de tiers. Le tribunal regional de Munich
         (LG Munchen I, 3 O 17493/20) a juge ce seul appel suffisant pour
         caracteriser une atteinte. Plus aucune requete ne sort, et l'affichage
         ne depend plus de la disponibilite d'un service tiers. -->

    <!-- Structured data (schema.org): helps Google understand this is a real
         SaaS product from a real company, and is a prerequisite for rich
         results (star ratings, pricing, FAQ dropdowns) in search listings.
         Kept in static index.html (not injected by React) so it's present
         even for crawlers that don't execute JavaScript. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SK GROUP",
      "url": "https://agentdebureau.fr/",
      "logo": "https://agentdebureau.fr/favicon.svg",
      "email": "contact@agentdebureau.fr",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "17 rue Saint-Exupéry",
        "postalCode": "67500",
        "addressLocality": "Haguenau",
        "addressCountry": "FR"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Ajant Bureau",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "CRM, standardiste IA et gestion de bureau",
      "operatingSystem": "Web, iOS, Android",
      "url": "https://agentdebureau.fr/",
      "description": "Plateforme SaaS française qui centralise et automatise la gestion de bureau : standardiste IA, CRM, appels, agenda, devis, facturation avec relances automatiques, stock, tri IA des e-mails de support et agents IA multi-tâches.",
      "inLanguage": "fr-FR",
      "publisher": {
        "@type": "Organization",
        "name": "SK GROUP"
      },
      "offers": [
        {
          "@type": "Offer",
          "name": "Starter",
          "price": "29",
          "priceCurrency": "EUR",
          "priceValidUntil": "2027-12-31",
          "description": "Jusqu'à 5 utilisateurs, essai gratuit 14 jours sans carte bancaire."
        },
        {
          "@type": "Offer",
          "name": "Professionnel",
          "price": "79",
          "priceCurrency": "EUR",
          "priceValidUntil": "2027-12-31",
          "description": "Jusqu'à 15 utilisateurs, toutes les fonctionnalités IA débloquées."
        },
        {
          "@type": "Offer",
          "name": "Entreprise",
          "price": "199",
          "priceCurrency": "EUR",
          "priceValidUntil": "2027-12-31",
          "description": "Jusqu'à 100 utilisateurs."
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
