<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Ajant Bureau - Solution Professionnelle</title>
    <meta name="description" content="Ajant Bureau - Solution professionnelle de gestion de bureau et centre d'appels. Tableau de bord, appels, contacts, taches, messages, analyse IA." />
    <!-- Admin / espace client: jamais indexer. Defense-en-profondeur en plus de robots.txt
         (certains crawlers ignorent robots mais respectent X-Robots-Tag / meta robots). -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="theme-color" content="#1a2744" />
    <!-- `apple-mobile-web-app-capable` est deprecie; on garde les deux: le nom
         standard pour les navigateurs recents, l'ancien pour les versions iOS
         qui ne connaissent que celui-la. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agent Bureau" />
    <meta name="application-name" content="Ajant Bureau" />
    <meta name="msapplication-TileColor" content="#1a2744" />
    <meta name="msapplication-config" content="none" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG et non SVG: iOS ignore le SVG pour l'icone d'ecran d'accueil et
         retombe alors sur une capture de la page, ce qui donne une vignette
         floue au lieu de l'icone. 180x180 est la taille attendue par iOS. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
