# Cloud Build CI/CD pipeline for Ajant Bureau.
# Triggered on push to `main` (see the Cloud Build trigger config) — builds
# both container images and deploys both Cloud Run services in sequence, so
# the web service always points at the api revision from the SAME commit.
steps:
  # Deployment gate. Cloud Build triggers are independent from GitHub Actions;
  # without this step a commit can reach Cloud Run while its CI typecheck is
  # still running (or has already failed).
  - id: quality-gate
    name: 'node:24-bookworm-slim'
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@9.15.0 --activate
        pnpm install --frozen-lockfile
        pnpm run typecheck
        # Le stock d'avertissements est fige par --max-warnings; toute autre
        # regle est une erreur. Voir eslint.config.mjs.
        pnpm run lint:ratchet
        pnpm --filter @workspace/api-spec routes:check
        pnpm --filter @workspace/api-server tenant:check
        pnpm run security:audit

  - id: start-test-db
    name: 'gcr.io/cloud-builders/docker'
    args:
      - run
      - --detach
      - --name=agent-bureau-ci-postgres
      - --network=cloudbuild
      - --health-cmd=pg_isready -U postgres -d agent_de_bureau_test
      - --health-interval=2s
      - --health-timeout=3s
      - --health-retries=30
      - -e
      - POSTGRES_USER=postgres
      - -e
      - POSTGRES_PASSWORD=postgres
      - -e
      - POSTGRES_DB=agent_de_bureau_test
      - postgres:16
    waitFor: ['quality-gate']

  - id: test-gate
    name: 'node:24-bookworm-slim'
    entrypoint: bash
    env:
      - 'DATABASE_URL=postgresql://postgres:postgres@agent-bureau-ci-postgres:5432/agent_de_bureau_test'
      - 'AI_INTEGRATIONS_GEMINI_BASE_URL=http://127.0.0.1:9/unused'
      - 'AI_INTEGRATIONS_GEMINI_API_KEY=ci-placeholder'
      - 'AI_INTEGRATIONS_OPENAI_BASE_URL=http://127.0.0.1:9/unused'
      - 'AI_INTEGRATIONS_OPENAI_API_KEY=ci-placeholder'
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@9.15.0 --activate
        for attempt in $(seq 1 30); do
          node -e "const net=require('net');const s=net.connect(5432,'agent-bureau-ci-postgres',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))" && break
          if [ "$attempt" = 30 ]; then echo "Test database did not become ready"; exit 1; fi
          sleep 2
        done
        cd lib/db
        node ./scripts/ensure-search-extensions.mjs
        node ./scripts/ensure-unique-constraint-names.mjs
        node ./scripts/ensure-automation-logs-rule-id.mjs
        node ./scripts/ensure-fk-orphans.mjs
        pnpm exec drizzle-kit push --force --config ./drizzle.config.ts
        # Le garde-fou anti-perte, exerce a chaque build. La base de CI vient
        # d'etre synchronisee, il ne doit donc rien trouver: s'il signale une
        # suppression, c'est que SA lecture du schema a derive — et un
        # garde-fou qui a derive ne protege plus la production, ou il est le
        # seul rempart devant un `push --force` lance a la main.
        node ./scripts/schema-guard.mjs
        node ./scripts/ensure-audit-append-only.mjs
        # Ces trois pas manquaient a la porte qui bloque la production.
        # ensure-user-quota installe le trigger Postgres qui applique la limite
        # de sieges payants: c'est un controle de facturation, et il n'existait
        # dans aucune base de test. verify-schema-sync verifie ensuite que la
        # poussee a produit les tables/colonnes dont l'app depend et n'a pas
        # detruit user_sessions.
        node ./scripts/ensure-user-quota.mjs
        node ./scripts/ensure-user-sessions.mjs
        node ./scripts/verify-schema-sync.mjs
        cd ../..
        pnpm --filter @workspace/api-server run test
        # L'application que les clients ouvrent tous les jours: sa suite
        # existait et passait, mais aucune porte ne l'appelait.
        pnpm --filter @workspace/buro-ajani run test
        pnpm --filter @workspace/mobile run test
        pnpm --filter @workspace/tanitim run test
        pnpm --filter @workspace/demo-handoff run test
    waitFor: ['start-test-db']

  - id: build-api
    name: 'gcr.io/cloud-builders/docker'
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'deploy/Dockerfile.api', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${_TAG}', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:latest', '.']
    waitFor: ['test-gate']

  - id: push-api
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api']
    waitFor: ['build-api']

  - id: deploy-api
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail

        # Un build en retard ne doit pas ecraser un plus recent.
        #
        # Le 11/09/2026: le build de 57a4b87 (cree a 10:23) a fini a 10:48 et a
        # deploye; celui de f92100f (cree a 10:08, donc PLUS ANCIEN) a fini a
        # 10:55 et a deploye par-dessus. La production est restee cinq heures
        # sur le commit precedent. Les deux builds etaient verts et avaient
        # raison de l'etre: c'est l'ORDRE entre eux qui etait faux, et l'ordre
        # n'appartenait a aucun des deux.
        #
        # On lit ce qui tourne par /api/healthz plutot qu'en fouillant les
        # variables du service: c'est la meme source que celle sur laquelle la
        # veille quotidienne s'appuie, et elle dit ce qui SERT vraiment, pas ce
        # que la configuration promet. Si l'appel echoue, la variable reste
        # vide et la garde laisse passer.
        DEPLOYE="$$(curl -sf --max-time 20 '${_PUBLIC_URL}/api/healthz' 2>/dev/null | sed -n 's/.*"build":"\([^"]*\)".*/\1/p')"
        bash deploy/garde-ordre-deploiement.sh '${_TAG}' "$$DEPLOYE"
        if [ "$$?" = "10" ]; then
          # Ni une panne ni un echec: ce build est simplement depasse. Les
          # deploiements web et tanitim lisent ce temoin pour s'abstenir aussi,
          # sinon l'interface partirait sans l'API qui va avec.
          touch /workspace/.deploiement-depasse
          exit 0
        fi

        # Identite du build, lisible ensuite sur /api/healthz et /api/app-version.
        # `--update-env-vars` et NON `--set-env-vars`: le second remplace toute la
        # configuration du service et effacerait secrets et reglages en place.
        # PUBLIC_URL construit TOUS les liens des courriels (activation de compte,
        # reinitialisation de mot de passe, fin d'essai, abonnement) — dix-huit
        # endroits dans email.ts. En production il valait
        # `https://agent-de-bureau-web-...run.app`: chaque client recevait donc des
        # liens vers un hote Cloud Run brut au lieu du domaine de la marque. Sur un
        # lien de reinitialisation de mot de passe, cela apprend a l'utilisateur a
        # cliquer sur un domaine qu'il ne reconnait pas — exactement ce qu'un
        # hameconnage exploite — et le lien casserait si l'URL du service changeait.
        # Declare ici plutot que pose a la main: une variable posee une fois ne se
        # relit pas, et personne ne sait plus pourquoi elle vaut ce qu'elle vaut.
        #
        # Affinite de session. Le service tourne jusqu'a trois instances et
        # certains etats ne peuvent PAS etre partages: le flux SSE d'un cycle
        # d'agents porte un EventEmitter et un AbortController, qui n'existent
        # que dans le processus qui a lance le travail. Sans affinite, le
        # navigateur qui vient lire la progression tombe une fois sur deux sur
        # une instance qui ne connait pas ce travail et voit un flux vide.
        # L'affinite est « au mieux » cote Cloud Run: elle ne remplace pas un
        # etat partage, elle enleve seulement le cas ou l'etat partageable ne
        # l'est pas.
        exec gcloud run deploy '${_API_SERVICE}' \
          --image='${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${_TAG}' \
          --region='${_REGION}' \
          --platform=managed \
          --update-env-vars=BUILD_SHA=${_TAG},BUILD_ID=${BUILD_ID},PUBLIC_URL=${_PUBLIC_URL} \
          --session-affinity
    waitFor: ['push-api']

  - id: build-web
    name: 'gcr.io/cloud-builders/docker'
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'deploy/Dockerfile.web.cloudrun', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:${_TAG}', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:latest', '.']
    waitFor: ['test-gate']

  - id: push-web
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web']
    waitFor: ['build-web']

  - id: deploy-web
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail
        # Si l'API s'est abstenue parce que ce build est depasse, l'interface
        # doit s'abstenir aussi: une interface plus recente que son API est
        # pire qu'une interface en retard — elle appelle des routes qui
        # n'existent pas encore.
        if [ -f /workspace/.deploiement-depasse ]; then
          echo "deploiement ignore: build depasse par un commit plus recent"
          exit 0
        fi
        exec gcloud run deploy '${_WEB_SERVICE}' \
          --image='${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:${_TAG}' \
          --region='${_REGION}' \
          --platform=managed
    waitFor: ['push-web', 'deploy-api']

  - id: build-tanitim
    name: 'gcr.io/cloud-builders/docker'
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'deploy/Dockerfile.tanitim.cloudrun', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/tanitim:${_TAG}', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/tanitim:latest', '.']
    waitFor: ['test-gate']

  - id: push-tanitim
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/tanitim']
    waitFor: ['build-tanitim']

  - id: deploy-tanitim
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        set -uo pipefail
        # Meme temoin que l'API et l'interface: les trois services avancent
        # ensemble ou pas du tout.
        if [ -f /workspace/.deploiement-depasse ]; then
          echo "deploiement ignore: build depasse par un commit plus recent"
          exit 0
        fi
        exec gcloud run deploy '${_TANITIM_SERVICE}' \
          --image='${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/tanitim:${_TAG}' \
          --region='${_REGION}' \
          --platform=managed \
          --allow-unauthenticated
    waitFor: ['push-tanitim', 'deploy-api']

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/api:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/web:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/tanitim:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/tanitim:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

substitutions:
  # Etiquette des images. `SHORT_SHA` n'est renseigne QUE par un declencheur
  # Cloud Build ; lors d'un `gcloud builds submit` manuel il est vide, ce qui
  # produisait un nom d'image invalide (`.../api:`) et faisait echouer le build
  # avant meme la premiere etape. On passe donc par une substitution explicite,
  # surchargeable : `--substitutions=_TAG=$(git rev-parse --short HEAD)` en
  # manuel, `_TAG=$SHORT_SHA` cote declencheur.
  _TAG: latest
  _REGION: europe-west9
  _AR_REPO: agent-de-bureau
  _API_SERVICE: agent-de-bureau-api
  _WEB_SERVICE: agent-de-bureau-web
  _TANITIM_SERVICE: agent-de-bureau-tanitim
  _PUBLIC_URL: https://app.agentdebureau.fr

timeout: 1800s
