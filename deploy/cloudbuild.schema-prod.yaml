# Poussee du schema vers la base de PRODUCTION, depuis Cloud Build.
#
# POURQUOI CE FICHIER EXISTE
#
# La poussee se faisait jusqu'ici a la main, via `deploy/gcp-schema-push.sh`,
# depuis un poste. Ce script demande des identifiants applicatifs locaux
# (`gcloud auth application-default login`), c'est-a-dire un navigateur et une
# personne devant. Consequence mesuree: le #78 a ajoute la colonne
# `tasks.created_by_agent` le 11 septembre, la fusion est partie sans la
# poussee, et la production a passe TROIS JOURS avec un moteur d'automatisation
# en echec toutes les cinq minutes (1011 erreurs) et le panneau « activite
# recente » du tableau de bord en 500.
#
# Ici, personne n'est devant: le compte de service des builds porte deja
# `roles/cloudsql.client`, et Secret Manager lui fournit l'URL de connexion.
# Aucun identifiant ne transite par un poste, et aucun humain ne lit le mot de
# passe — y compris celui qui lance le build.
#
# COMMENT LE LANCER (sans passer par GitHub):
#
#   gcloud builds submit --region=europe-west9 \
#     --config=deploy/cloudbuild.schema-prod.yaml .
#
# `builds submit` televerse les fichiers LOCAUX. Le depot n'intervient pas: ce
# qui est pousse est ce qu'on a sous la main, ce qui est exactement ce qu'on
# veut pour une operation de reparation.
#
# CE QU'IL NE FAIT PAS
#
# Il ne deploie rien. Le schema et le code sont deux mouvements distincts, et
# c'est deliberé: le schema doit precéder le code, jamais l'inverse.

steps:
  - id: pousser-le-schema
    name: 'node:24-bookworm-slim'
    entrypoint: bash
    secretEnv: ['DATABASE_URL_PROD']
    args:
      - -ceu
      - |
        # Le proxy Cloud SQL, en pur binaire: il s'authentifie tout seul avec
        # le compte de service du build (serveur de metadonnees), sans cle ni
        # fichier d'identifiants.
        node -e "
          const https = require('https'), fs = require('fs');
          const url = 'https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.0/cloud-sql-proxy.linux.amd64';
          const f = fs.createWriteStream('/workspace/cloud-sql-proxy');
          https.get(url, r => { r.pipe(f); f.on('finish', () => process.exit(0)); })
            .on('error', e => { console.error(e); process.exit(1); });
        "
        chmod +x /workspace/cloud-sql-proxy
        /workspace/cloud-sql-proxy --port 5432 "$PROJECT_ID:${_SQL_REGION}:${_SQL_INSTANCE}" &
        PROXY=$$!

        # Attendre le tunnel plutot que de dormir un temps arbitraire.
        for i in $$(seq 1 30); do
          if node -e "require('net').connect(5432,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))"; then break; fi
          if [ "$$i" = 30 ]; then echo "Le proxy Cloud SQL n'a pas ouvert le tunnel."; exit 1; fi
          sleep 1
        done

        # L'URL du secret pointe vers la socket Cloud SQL telle que Cloud Run
        # la monte. On garde l'utilisateur, le mot de passe et la base, et on
        # remplace seulement le point de connexion par le tunnel local. Le
        # mot de passe n'est jamais affiche: il ne quitte pas la variable.
        export DATABASE_URL="$$(node -e "
          const u = process.env.DATABASE_URL_PROD;
          const m = u.match(/^(postgres(?:ql)?):\/\/([^:]+):([^@]+)@/);
          if (!m) { console.error('URL de base inattendue'); process.exit(1); }
          const base = (u.split('?')[0].split('/').pop()) || 'agent_de_bureau';
          process.stdout.write(m[1] + '://' + m[2] + ':' + m[3] + '@127.0.0.1:5432/' + (base || 'agent_de_bureau'));
        ")"

        corepack enable
        corepack prepare pnpm@9.15.0 --activate
        pnpm install --frozen-lockfile

        cd lib/db
        node ./scripts/ensure-search-extensions.mjs
        node ./scripts/ensure-unique-constraint-names.mjs
        node ./scripts/ensure-automation-logs-rule-id.mjs
        node ./scripts/ensure-fk-orphans.mjs

        # Le garde-fou AVANT la poussee: `push --force` ne pose aucune
        # question, pas meme pour supprimer une table. C'est la production.
        node ./scripts/schema-guard.mjs

        pnpm exec drizzle-kit push --force --config ./drizzle.config.ts

        node ./scripts/ensure-audit-append-only.mjs
        node ./scripts/ensure-user-quota.mjs
        node ./scripts/ensure-user-sessions.mjs

        # Verifier que la poussee a REELLEMENT produit ce que le code attend.
        # Une poussee qui « reussit » sans creer la colonne ne se voit sinon
        # qu'a la premiere requete d'un vrai client, en 500.
        node ./scripts/verify-schema-sync.mjs

        kill $$PROXY 2>/dev/null || true
        echo "== Schema de production synchronise =="

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/database-url/versions/latest
      env: 'DATABASE_URL_PROD'

substitutions:
  _SQL_REGION: europe-west9
  _SQL_INSTANCE: agent-de-bureau-db

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1800s
